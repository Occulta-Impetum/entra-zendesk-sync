# Example non-secret configuration for Entra -> Zendesk Sync.
# The graphical setup wizard writes config/config.yaml. The bootstrap workflow
# discovers the actual Zendesk user-field keys and saves them under zendesk.user_fields.

version: 1

entra:
  tenant_id: "00000000-0000-0000-0000-000000000000"
  client_id: "00000000-0000-0000-0000-000000000000"

zendesk:
  subdomain: "example"
  default_role: "end-user"
  user_fields:
    employee_id: employee_id
    job_title: standard::job_title
    manager: standard::manager

mappings:
  - entra_group:
      id: "00000000-0000-0000-0000-000000000000"
      name: "Example Zendesk Users"
    zendesk_organization:
      id: 123456789
      name: "Example Organization"

behavior:
  suspend_when_out_of_scope: true
  suspend_when_entra_disabled: true
  ambiguous_group_membership: conflict
  protect_zendesk_staff_roles: true
  dry_run_by_default: true
